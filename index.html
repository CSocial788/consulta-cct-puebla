<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CCT - Puebla</title>
  
  <!-- Tipografía Noto Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado con Logo de Becas -->
  <header class="header">
    <div class="header-container">
      <img src="logo.png" alt="Logo Becas Bienestar" class="logo-header">
      <div class="header-text">
        <h1>Asambleas Informativas</h1>
        <h2>Beca Universal de Educación Básica "Rita Cetina" <span class="texto-puebla">Puebla</span></h2>
      </div>
    </div>
  </header>

  <main class="container">
    <p class="instruction">Coloca la clave de la escuela (CCT) para conocer la programación:</p>
    
    <div class="search-box">
      <input type="text" id="cctInput" placeholder="Ej. 21DPR3462M" maxlength="10">
      <button id="searchBtn">🔎 CONSULTAR</button>
    </div>

    <div id="result" class="result-box"></div>
  </main>

  <!-- Contenedor para la Animación (debajo del buscador) -->
  <div class="animacion-container">
    <!-- Cambia 'animacion.gif' por el nombre exacto con el que subiste tu archivo -->
    <img src="animacion.png" alt="Animación" class="imagen-animada">
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
